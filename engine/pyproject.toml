[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "siliconsmith"
version = "0.1.0"
description = "An agent that changes the chip to fit the code: invents, implements and proves custom RISC-V instructions for your hot loops."
readme = "../README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40",
  "pydantic>=2.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
sandboxes = ["contree-sdk==0.3.6"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
matter = ["numpy", "scipy"]
dev = ["pytest>=8"]

[project.scripts]
siliconsmith = "siliconsmith.cli:main"
ss = "siliconsmith.cli:main"

[tool.setuptools.packages.find]
include = ["siliconsmith*"]

[tool.setuptools.package-data]
siliconsmith = ["examples/*/*"]
