[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hardwright"
version = "0.1.0"
description = "Verifiers a hardware agent cannot argue with: offline board and heat-spreader checks, a CLI and an MCP server; plus SiliconSmith, an agent that proves custom RISC-V instructions."
readme = "README.md"
license = { text = "Apache-2.0" }
keywords = ["hardware", "mcp", "agents", "verification", "risc-v", "pcb", "thermal", "nemotron"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: Apache Software License", "Topic :: Scientific/Engineering", "Intended Audience :: Developers"]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
]

[project.urls]
Homepage = "https://siliconsmith.vercel.app"
Repository = "https://github.com/hash066/siliconsmith"

[project.optional-dependencies]
agent = ["openai>=1.40", "httpx>=0.27"]
sandboxes = ["contree-sdk==0.3.6", "openai>=1.40", "httpx>=0.27"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "openai>=1.40", "httpx>=0.27"]
matter = ["numpy", "scipy"]
all = ["numpy", "scipy", "openai>=1.40", "httpx>=0.27", "contree-sdk==0.3.6", "fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
siliconsmith = "siliconsmith.cli:main"
ss = "siliconsmith.cli:main"
hardwright = "hardwright.cli:main"

[tool.setuptools.packages.find]
include = ["siliconsmith*", "hardwright*"]

[tool.setuptools.package-data]
siliconsmith = ["examples/*/*", "board/*.json", "board/parts/*.json", "board/templates/*.json", "board/designs/*.json"]
